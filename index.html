<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e1e1e">
    
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Mobile%20Code%20Pro%22%2C%22short_name%22%3A%22CodePro%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%231e1e1e%22%2C%22theme_color%22%3A%22%231e1e1e%22%7D'>
    <title>Mobile Code Pro</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #272822; color: #f8f8f2; font-family: sans-serif; overflow: hidden; overscroll-behavior-y: none; }
        #app-container { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

        /* タブ */
        #tabs-container { display: flex; background: #1e1e1e; height: 40px; align-items: center; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #111; }
        #tabs-container::-webkit-scrollbar { display: none; }
        #tabs { display: flex; height: 100%; }
        .tab { padding: 0 15px; height: 100%; display: flex; align-items: center; background: #2d2d2d; border-right: 1px solid #1e1e1e; cursor: pointer; white-space: nowrap; font-size: 14px; }
        .tab.active { background: #272822; color: #a6e22e; border-top: 2px solid #a6e22e; font-weight: bold; }
        .tab-close { margin-left: 10px; font-size: 12px; color: #999; padding: 5px; }
        .icon-btn { background: none; border: none; color: white; padding: 0 15px; height: 100%; cursor: pointer; }

        /* エディタ領域 */
        #main-area { display: flex; flex: 1; overflow: hidden; position: relative; width: 100%; }
        #editor-wrapper { flex: 1; height: 100%; overflow: hidden; }
        .CodeMirror { height: 100%; font-family: 'SF Mono', Consolas, monospace; font-size: 14px; background: #272822; }

        /* 検索＆置換パネル */
        #search-panel {
            position: absolute; top: 0; left: 0; width: 100%; background: rgba(30, 30, 30, 0.95);
            border-bottom: 1px solid #000; z-index: 50; display: none; flex-direction: column; padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6); backdrop-filter: blur(4px);
        }
        .s-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .s-row:last-child { margin-bottom: 0; }
        .s-input { flex: 1; background: #111; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 4px; font-size: 14px; outline: none; }
        .s-input:focus { border-color: #a6e22e; }
        .s-btn { background: #444; color: #eee; border: none; padding: 8px 12px; border-radius: 4px; font-size: 14px; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .s-btn:active { background: #666; }
        .s-btn-icon { padding: 8px 12px; }
        .s-toggle { background: #333; color: #aaa; border: 1px solid #555; padding: 6px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .s-toggle.active { background: #a6e22e; color: #222; border-color: #a6e22e; }

        /* ミニマップ */
        #minimap-track {
            width: 65px; background: #1e1e1e; border-left: 1px solid #333;
            position: relative; overflow: hidden; touch-action: none; cursor: pointer; flex-shrink: 0;
        }
        /* GPUレンダリング強制 */
        #minimap-content { position: absolute; width: 100%; top: 0; left: 0; will-change: transform; transform: translate3d(0,0,0); }
        #minimap-canvas { width: 100%; display: block; }
        #minimap-slider {
            position: absolute; width: 100%; background: rgba(255, 255, 255, 0.12);
            left: 0; pointer-events: none; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 2px; box-shadow: 0 0 5px rgba(0,0,0,0.5);
            will-change: top, height;
        }

        /* ツールバー */
        #toolbar {
            height: 55px; background: #1e1e1e; display: flex; align-items: center; padding: 0 5px; overflow-x: auto; gap: 4px; border-top: 1px solid #333; scrollbar-width: none;
        }
        #toolbar::-webkit-scrollbar { display: none; }
        .tool-btn {
            flex: 0 0 auto; background: none; border: none; color: #ccc; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; width: 62px; height: 100%; border-radius: 6px; cursor: pointer; white-space: nowrap;
        }
        .tool-btn:active { background: #333; color: #a6e22e; }
        .tool-btn i { font-size: 18px; margin-bottom: 4px; }
        .separator { width: 1px; height: 30px; background: #444; flex: 0 0 auto; margin: 0 2px; }

        .toast {
            position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #a6e22e; color: #272822; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="tabs-container">
            <div id="tabs"></div>
            <button id="btn-new-tab" class="icon-btn"><i class="fas fa-plus"></i></button>
        </div>

        <div id="main-area">
            <div id="editor-wrapper">
                <textarea id="code-editor"></textarea>
            </div>
            
            <div id="search-panel">
                <div class="s-row">
                    <input type="text" id="s-input" class="s-input" placeholder="検索...">
                    <button id="t-case" class="s-toggle" title="大文字小文字区別">Aa</button>
                    <button id="t-word" class="s-toggle" title="単語単位">\b</button>
                    <button id="s-prev" class="s-btn s-btn-icon"><i class="fas fa-arrow-up"></i></button>
                    <button id="s-next" class="s-btn s-btn-icon"><i class="fas fa-arrow-down"></i></button>
                    <button id="s-close" class="s-btn s-btn-icon" style="background:#b22222;"><i class="fas fa-times"></i></button>
                </div>
                <div class="s-row" id="r-row" style="display:none;">
                    <input type="text" id="r-input" class="s-input" placeholder="置換...">
                    <button id="r-btn" class="s-btn">置換</button>
                    <button id="r-all-btn" class="s-btn">全置換</button>
                </div>
            </div>

            <div id="minimap-track">
                <div id="minimap-content">
                    <canvas id="minimap-canvas"></canvas>
                    <div id="minimap-slider"></div>
                </div>
            </div>
        </div>

        <div id="toolbar">
            <button id="btn-open" class="tool-btn"><i class="fas fa-folder-open"></i> 開く</button>
            <button id="btn-save" class="tool-btn"><i class="fas fa-save"></i> 上書保存</button>
            <div class="separator"></div>
            <button id="btn-search" class="tool-btn"><i class="fas fa-search"></i> 検索</button>
            <button id="btn-replace" class="tool-btn"><i class="fas fa-exchange-alt"></i> 置換</button>
            <div class="separator"></div>
            <button id="btn-rename" class="tool-btn"><i class="fas fa-pen"></i> 名前変更</button>
            <button id="btn-save-as" class="tool-btn"><i class="fas fa-file-download"></i> DL保存</button>
            <div class="separator"></div>
            <button id="btn-format" class="tool-btn"><i class="fas fa-magic"></i> 整形</button>
            <button id="btn-remove-comments" class="tool-btn"><i class="fas fa-comment-slash"></i> コメ削除</button>
            <button id="btn-remove-empty" class="tool-btn"><i class="fas fa-align-justify"></i> 空行削除</button>
        </div>
    </div>

    <input type="file" id="file-input" style="display: none;" multiple>
    <div id="toast" class="toast">完了</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>

    <script>
        const ui = {
            tabs: document.getElementById('tabs'), toast: document.getElementById('toast'),
            fileInput: document.getElementById('file-input'),
            track: document.getElementById('minimap-track'), content: document.getElementById('minimap-content'),
            canvas: document.getElementById('minimap-canvas'), slider: document.getElementById('minimap-slider'),
            sPanel: document.getElementById('search-panel'), rRow: document.getElementById('r-row'),
            sInput: document.getElementById('s-input'), rInput: document.getElementById('r-input')
        };
        const ctx = ui.canvas.getContext('2d', { alpha: false });

        let editor; let tabs = []; let activeTabId = null;

        function showToast(msg) {
            ui.toast.textContent = msg; 
            ui.toast.classList.add('show');
            setTimeout(() => ui.toast.classList.remove('show'), 2500);
        }

        window.onload = function() {
            const savedData = localStorage.getItem('mobileCodePro_V9');
            if (savedData) {
                try {
                    const state = JSON.parse(savedData);
                    tabs = state.tabs || []; activeTabId = state.activeTabId || null;
                } catch(e) {}
            }
            if (tabs.length === 0) addTab("index.js", "// 独自フォーマッタ・スクロール超最適化\n\nfunction init() {\n  console.log('Mobile Code Pro V9');\n}");
            if (!activeTabId) activeTabId = tabs[0].id;

            editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                mode: "javascript", theme: "monokai", lineNumbers: true, lineWrapping: true,
                inputStyle: "contenteditable", spellcheck: false, autocorrect: false, viewportMargin: 20
            });

            let minimapTimeout;
            editor.on('change', () => {
                const tab = tabs.find(t => t.id === activeTabId);
                if (tab) { tab.content = editor.getValue(); saveState(); }
                clearTimeout(minimapTimeout);
                minimapTimeout = setTimeout(drawMinimap, 400);
            });

            // ★ スクロールの極限軽量化 (DOMから直接読み取り)
            const scroller = editor.getScrollerElement();
            let ticking = false;
            scroller.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => { updateMinimapSlider(scroller); ticking = false; });
                    ticking = true;
                }
            }, { passive: true });

            renderTabs(); loadTabContent(activeTabId); setTimeout(drawMinimap, 100);
        };

        function addTab(name, content = "", fileHandle = null) {
            const newId = "t_" + Date.now(); tabs.push({ id: newId, name: name, content: content, fileHandle: fileHandle });
            activeTabId = newId; saveState(); if (editor) { renderTabs(); loadTabContent(newId); }
        }
        function loadTabContent(id) {
            const tab = tabs.find(t => t.id === id);
            if (tab && editor) {
                const ext = tab.name.split('.').pop().toLowerCase();
                let mode = "javascript"; if(ext === 'html') mode = "xml"; if(ext === 'css') mode = "css";
                editor.setOption("mode", mode);
                if (editor.getValue() !== tab.content) editor.setValue(tab.content);
                setTimeout(drawMinimap, 50);
            }
        }
        function renderTabs() {
            ui.tabs.innerHTML = '';
            tabs.forEach(tab => {
                const el = document.createElement('div'); el.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
                const icon = tab.fileHandle ? '<i class="fas fa-file-code" style="color:#66d9ef; margin-right:5px;"></i>' : '';
                el.innerHTML = `${icon}<span class="tab-name">${tab.name}</span><span class="tab-close"><i class="fas fa-times"></i></span>`;
                el.querySelector('.tab-name').onclick = () => { activeTabId = tab.id; renderTabs(); loadTabContent(activeTabId); saveState(); };
                el.querySelector('.tab-close').onclick = (e) => {
                    e.stopPropagation(); tabs = tabs.filter(t => t.id !== tab.id);
                    if (tabs.length === 0) addTab("untitled.txt", ""); else if (activeTabId === tab.id) activeTabId = tabs[tabs.length - 1].id;
                    renderTabs(); loadTabContent(activeTabId); saveState();
                };
                ui.tabs.appendChild(el);
            });
        }
        function saveState() {
            const safeTabs = tabs.map(t => ({ id: t.id, name: t.name, content: t.content }));
            localStorage.setItem('mobileCodePro_V9', JSON.stringify({ tabs: safeTabs, activeTabId }));
        }

        // --- ツールバーアクション ---
        document.getElementById('btn-open').onclick = async () => {
            if (window.showOpenFilePicker) { try { const [fh] = await window.showOpenFilePicker(); const f = await fh.getFile(); addTab(f.name, await f.text(), fh); showToast("開きました"); } catch(e) {} } else { ui.fileInput.click(); }
        };
        ui.fileInput.addEventListener('change', (e) => { Array.from(e.target.files).forEach(f => { const r = new FileReader(); r.onload = (ev) => addTab(f.name, ev.target.result); r.readAsText(f); }); e.target.value = ''; });
        document.getElementById('btn-save').onclick = async () => {
            const tab = tabs.find(x => x.id === activeTabId); saveState();
            if (tab.fileHandle && window.showOpenFilePicker) { try { const w = await tab.fileHandle.createWritable(); await w.write(tab.content); await w.close(); showToast("本体に上書き保存しました！"); } catch(e) { showToast("上書き失敗"); } } else { showToast("ブラウザ内に保存しました"); }
        };
        document.getElementById('btn-new-tab').onclick = () => { const n = prompt("ファイル名", "new.js"); if(n) addTab(n); };
        document.getElementById('btn-rename').onclick = () => { const t = tabs.find(x => x.id === activeTabId); const n = prompt("新しいファイル名", t.name); if(n) { t.name = n; renderTabs(); loadTabContent(activeTabId); saveState(); } };
        document.getElementById('btn-save-as').onclick = () => { const t = tabs.find(x => x.id === activeTabId); const a = document.createElement("a"); a.href = window.URL.createObjectURL(new Blob([t.content], { type: "text/plain" })); a.download = t.name; a.click(); showToast("ダウンロードしました"); };

        // ★ 完全独自の超高精度インデントフォーマッタ (CodeMirrorのバグ回避)
        document.getElementById('btn-format').onclick = () => {
            const mode = editor.getOption("mode");
            const code = editor.getValue();
            const lines = code.split('\n');
            let out = []; let indent = 0; const tab = "  "; // 2スペース
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) { out.push(""); continue; }

                // コメントと文字列を無視した「純粋なコード部分」だけでカッコをカウントする
                let cleanLine = line.replace(/(['"`])(?:(?!\1)[^\\]|\\.)*\1/g, "")
                                    .replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/.*$/, "");

                // 現在の行の先頭が閉じカッコならインデントを下げる
                if (mode === "javascript" || mode === "css") {
                    if (cleanLine.match(/^[\}\]\)]/)) indent = Math.max(0, indent - 1);
                } else if (mode === "xml") {
                    if (cleanLine.match(/^<\/[a-zA-Z0-9-]+>/)) indent = Math.max(0, indent - 1);
                }

                out.push(tab.repeat(indent) + line);

                // 行内の開きと閉じの差分を計算し、次の行からのインデントに反映
                if (mode === "javascript" || mode === "css") {
                    let open = (cleanLine.match(/[\{\[\(]/g) || []).length;
                    let close = (cleanLine.match(/[\}\]\)]/g) || []).length;
                    indent += (open - close);
                } else if (mode === "xml") {
                    let open = (cleanLine.match(/<[a-zA-Z0-9-]+(?![^>]*\/>)[^>]*>/g) || []).length;
                    let close = (cleanLine.match(/<\/[a-zA-Z0-9-]+>/g) || []).length;
                    indent += (open - close);
                }
                if (indent < 0) indent = 0;
            }
            const formatted = out.join('\n');
            if (formatted !== code) { editor.setValue(formatted); showToast("インデントを整形しました"); }
            else { showToast("既に整形されています"); }
        };

        // --- コメント削除 ---
        document.getElementById('btn-remove-comments').onclick = () => {
            const mode = editor.getOption("mode"); let val = editor.getValue(); let newVal = val;
            if (mode === "javascript") newVal = val.replace(/(['"`])(?:(?!\1)[^\\]|\\.)*\1|^[ \t]*\/\*[\s\S]*?\*\/\r?\n?|^[ \t]*\/\/.*\r?\n?|\/\*[\s\S]*?\*\/|\/\/.*/gm, (m, q) => q ? m : "");
            else if (mode === "xml") newVal = val.replace(/(['"`])(?:(?!\1)[^\\]|\\.)*\1|^[ \t]*<!--[\s\S]*?-->\r?\n?|<!--[\s\S]*?-->/gm, (m, q) => q ? m : "");
            else if (mode === "css") newVal = val.replace(/(['"`])(?:(?!\1)[^\\]|\\.)*\1|^[ \t]*\/\*[\s\S]*?\*\/\r?\n?|\/\*[\s\S]*?\*\//gm, (m, q) => q ? m : "");
            if (newVal !== val) { editor.setValue(newVal); showToast("コメントを削除しました"); } else { showToast("コメントなし"); }
        };

        // --- 空行削除 ---
        document.getElementById('btn-remove-empty').onclick = () => {
            let val = editor.getValue(); let newVal = val.replace(/^[ \t]*$\r?\n/gm, "");
            if (newVal !== val) { editor.setValue(newVal); showToast("空行を削除しました"); } else { showToast("空行なし"); }
        };

        // --- 検索＆置換パネル ---
        let searchCursor = null; let lastQueryText = null; let matchCase = false; let wholeWord = false;
        document.getElementById('btn-search').onclick = () => { ui.sPanel.style.display = 'flex'; ui.rRow.style.display = 'none'; ui.sInput.focus(); };
        document.getElementById('btn-replace').onclick = () => { ui.sPanel.style.display = 'flex'; ui.rRow.style.display = 'flex'; ui.sInput.focus(); };
        document.getElementById('s-close').onclick = () => { ui.sPanel.style.display = 'none'; searchCursor = null; editor.focus(); };
        document.getElementById('t-case').onclick = function() { matchCase = !matchCase; this.classList.toggle('active', matchCase); lastQueryText = null; };
        document.getElementById('t-word').onclick = function() { wholeWord = !wholeWord; this.classList.toggle('active', wholeWord); lastQueryText = null; };

        function doSearch(reverse) {
            const q = ui.sInput.value; if (!q) return;
            if (lastQueryText !== q) searchCursor = null;
            let query = q; let escaped = q.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
            if (wholeWord) query = new RegExp('\\b' + escaped + '\\b', matchCase ? '' : 'i');
            else if (!matchCase) query = new RegExp(escaped, 'i');

            if (!searchCursor) { searchCursor = editor.getSearchCursor(query, editor.getCursor()); lastQueryText = q; }
            let found = reverse ? searchCursor.findPrevious() : searchCursor.findNext();
            if (!found) {
                searchCursor = editor.getSearchCursor(query, reverse ? CodeMirror.Pos(editor.lastLine()) : CodeMirror.Pos(editor.firstLine(), 0));
                found = reverse ? searchCursor.findPrevious() : searchCursor.findNext();
            }
            if (found) { editor.setSelection(searchCursor.from(), searchCursor.to()); editor.scrollIntoView({from: searchCursor.from(), to: searchCursor.to()}, 30); }
            else { showToast("見つかりません"); }
        }
        document.getElementById('s-prev').onclick = () => doSearch(true);
        document.getElementById('s-next').onclick = () => doSearch(false);
        ui.sInput.onkeydown = (e) => { if (e.key === 'Enter') doSearch(e.shiftKey); };
        document.getElementById('r-btn').onclick = () => { if (searchCursor && editor.somethingSelected()) searchCursor.replace(ui.rInput.value); doSearch(false); };
        document.getElementById('r-all-btn').onclick = () => {
            const q = ui.sInput.value; const r = ui.rInput.value; if (!q) return;
            let escaped = q.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
            let query = new RegExp(wholeWord ? '\\b' + escaped + '\\b' : escaped, matchCase ? 'g' : 'gi');
            editor.operation(() => { let cursor = editor.getSearchCursor(query); let count = 0; while (cursor.findNext()) { cursor.replace(r); count++; } showToast(`${count}件置換`); });
            searchCursor = null;
        };

        // ==========================================
        // ★ ミニマップ描画エンジン (四角排除＆Monokaiカラー完全一致)
        // ==========================================
        const MINIMAP_LINE_HEIGHT = 2.5; const MINIMAP_CHAR_WIDTH = 1.0;

        function drawMinimap() {
            if (!editor) return;
            const lines = editor.getValue().split('\n');
            const totalLines = Math.max(lines.length, 1);
            
            const cw = ui.track.clientWidth;
            const ch = Math.max(totalLines * MINIMAP_LINE_HEIGHT, ui.track.clientHeight);
            const dpr = window.devicePixelRatio || 1;
            
            ui.canvas.width = cw * dpr; ui.canvas.height = ch * dpr;
            ui.canvas.style.width = cw + 'px'; ui.canvas.style.height = ch + 'px';
            
            ctx.scale(dpr, dpr); ctx.fillStyle = "#1e1e1e"; ctx.fillRect(0, 0, cw, ch);
            
            const pNormal = new Path2D(); const pKeyword = new Path2D();
            const pComment = new Path2D(); const pString = new Path2D(); const pFunc = new Path2D();
            
            const rxKeyword = /^(var|let|const|function|class|if|for|while|return|import|export|switch|case|default|break|continue|new)\b/;
            const rxFunc = /^[a-zA-Z_$][a-zA-Z0-9_$]*|^<[a-zA-Z0-9-]+/; // 関数やHTMLタグっぽいやつ
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i]; if (line.length === 0) continue;
                const indent = line.search(/\S|$/); if (indent === line.length) continue; 
                
                const text = line.trim(); const y = i * MINIMAP_LINE_HEIGHT; 
                let cx = indent * MINIMAP_CHAR_WIDTH;
                
                // 単語、文字列、記号などを大まかに分解
                const tokens = text.match(/(\/\*[\s\S]*?\*\/|\/\/.*|(['"`])(?:(?!\2)[^\\]|\\.)*\2|[a-zA-Z_$][a-zA-Z0-9_$]*|[0-9]+|[^a-zA-Z0-9_$\s]+|\s+)/g) || [];
                
                for (let t of tokens) {
                    let tLen = t.length;
                    if (t.trim().length > 0) {
                        let target = pNormal;
                        if (t.startsWith('//') || t.startsWith('/*') || t.startsWith('<!--')) target = pComment;
                        else if (t.startsWith("'") || t.startsWith('"') || t.startsWith('`')) target = pString;
                        else if (rxKeyword.test(t)) target = pKeyword;
                        else if (rxFunc.test(t)) target = pFunc;
                        
                        // ★ ブロックではなく「高さ1pxの線」を描くことでVSCodeのコードの見た目を再現
                        target.rect(cx, y + 0.75, tLen * MINIMAP_CHAR_WIDTH, 1);
                    }
                    cx += tLen * MINIMAP_CHAR_WIDTH;
                    if (cx > cw) break;
                }
            }
            
            // Monokaiカラーに完全一致
            ctx.fillStyle = "#75715e"; ctx.fill(pComment);  // 茶色(コメント)
            ctx.fillStyle = "#f92672"; ctx.fill(pKeyword);  // ピンク(キーワード)
            ctx.fillStyle = "#e6db74"; ctx.fill(pString);   // 黄色(文字列)
            ctx.fillStyle = "#a6e22e"; ctx.fill(pFunc);     // 黄緑(関数/タグ)
            ctx.fillStyle = "rgba(248, 248, 242, 0.5)"; ctx.fill(pNormal); // 薄い白(通常文字)
            
            updateMinimapSlider(editor.getScrollerElement());
        }

        function updateMinimapSlider(scroller = editor.getScrollerElement()) {
            const trackH = ui.track.clientHeight;
            const scrollH = scroller.scrollHeight;
            const clientH = scroller.clientHeight;
            const scrollTop = scroller.scrollTop;
            
            const maxScrollTop = Math.max(1, scrollH - clientH);
            const scrollRatio = scrollTop / maxScrollTop;
            
            const mapHeight = Math.max(editor.lineCount() * MINIMAP_LINE_HEIGHT, trackH);
            
            const sliderH = (clientH / scrollH) * mapHeight;
            const sliderTop = (scrollTop / scrollH) * mapHeight;
            
            ui.slider.style.height = `${sliderH}px`; ui.slider.style.top = `${sliderTop}px`;
            
            let mapScrollY = 0;
            if (mapHeight > trackH) mapScrollY = scrollRatio * (mapHeight - trackH);
            ui.content.style.transform = `translate3d(0, -${mapScrollY}px, 0)`; // GPUアクセラレーションで移動
        }

        let isDraggingMinimap = false;
        function handleMinimapDrag(e) {
            e.preventDefault();
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = ui.track.getBoundingClientRect();
            let trackY = Math.max(0, Math.min(clientY - rect.top, rect.height));
            const ratio = trackY / rect.height;
            const scroller = editor.getScrollerElement();
            const maxScrollTop = Math.max(1, scroller.scrollHeight - scroller.clientHeight);
            editor.scrollTo(0, ratio * maxScrollTop);
        }

        ui.track.addEventListener('touchstart', (e) => { isDraggingMinimap = true; handleMinimapDrag(e); }, {passive: false});
        ui.track.addEventListener('touchmove', (e) => { if(isDraggingMinimap) handleMinimapDrag(e); }, {passive: false});
        ui.track.addEventListener('mousedown', (e) => { isDraggingMinimap = true; handleMinimapDrag(e); });
        
        window.addEventListener('mousemove', (e) => { if(isDraggingMinimap) handleMinimapDrag(e); });
        window.addEventListener('touchend', () => { isDraggingMinimap = false; });
        window.addEventListener('mouseup', () => { isDraggingMinimap = false; });
        window.addEventListener('resize', () => { setTimeout(drawMinimap, 100); });
    </script>
</body>
</html>
